name: build-exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pywebview pyinstaller
      - run: pyinstaller --onefile --windowed --name Shchitok --add-data "index.html;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Shchitok
          path: dist/Shchitok.exe
